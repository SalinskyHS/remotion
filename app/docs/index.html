<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS AutoApply – Dashboard Mejorado</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<main>
  <h1>ATS AutoApply – Dashboard Mejorado</h1>
  <h3>Carlos Eugenio Salinas H.</h3>

  <section class="grid cards" id="kpi-cards"></section>

  <div id="controls">
    <input id="search" type="text" placeholder="Search company or role..." />
    <select id="filterStatus"></select>
  </div>

  <h2>Pipeline</h2>
  <canvas id="chartPipeline" height="120"></canvas>

  <h2>Status Distribution</h2>
  <canvas id="chartStatus" height="120"></canvas>

  <h2>Aplicaciones Detalladas</h2>
  <div id="loader">Cargando datos…</div>
  <div id="error" style="color:#f87171;"></div>
  <div class="table-container">
    <table id="tableApps">
      <thead>
        <tr>
          <th>Fecha</th><th>Empresa</th><th>Rol</th><th>Estado</th><th>Follow-up</th><th>Keywords</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>Generado 2025-07-30 · Edita /data/data.json o apunta a tu WebApp.</footer>
</main>
<script src="./js/app.js"></script>
</body>
</html>
